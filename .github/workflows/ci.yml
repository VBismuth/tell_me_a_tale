name: CI & Release Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write  # needded for making release drafts and uploading assets 

jobs:
  quality-and-test:
    name: Type Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: dev-requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Run Mypy type checks
        run: python -m mypy source_merger.py src --strict

      - name: Run tests
        run: python -m src.tests

  build:
    if: >
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[Release]')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[Release]'))
    name: Build Asset for ${{ matrix.os }}
    needs: quality-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: storyteller-linux
            nuitka_flags: "--onefile --remove-output --output-dir=build --python-flag=-O --output-filename=storyteller"
          - os: macos-latest
            artifact_name: storyteller-macos
            nuitka_flags: "--onefile --remove-output --output-dir=build --clang --python-flag=-O --output-filename=storyteller"
          - os: windows-latest
            artifact_name: storyteller-windows
            nuitka_flags: "--onefile --remove-output --windows-app-icon=assets/tmt_logo.png --output-dir=build --msvc=latest --python-flag=-O --output-filename=storyteller"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: dev-requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          
      - name: Generate merged script
        shell: bash
        run: python source_merger.py

      - name: Upload merged script artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: storyteller-script
          path: ./build/storyteller.py

      - name: Build with Nuitka
        shell: bash
        run: printf "y\ny\ny\ny\ny\n" | python -m nuitka ${{ matrix.nuitka_flags }} build/storyteller.py

      - name: Pack binaries and resources
        shell: bash
        run: |
          mkdir -p build/${{ matrix.artifact_name }}
          [ -f "LICENSE" ] && cp "LICENSE" build/${{ matrix.artifact_name }}/
          [ -f "README.md" ] && cp "README.md" build/${{ matrix.artifact_name }}/
          [ -d "examples" ] && cp "examples" build/${{ matrix.artifact_name }}/examples
          if [ -f build/storyteller.exe ]; then
            mv build/storyteller.exe build/${{ matrix.artifact_name }}/
            zip -r build/${{ matrix.artifact_name }}.zip build/${{ matrix.artifact_name }}
          elif [ -f build/storyteller ]; then
            mv build/storyteller build/${{ matrix.artifact_name }}/
            tar -czf build/${{ matrix.artifact_name }}.tar.gz build/${{ matrix.artifact_name }}
          fi

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/${{ matrix.artifact_name }}.zip
            build/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    # Release is created only on push to master branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Structure assets for release
        run: |
          mkdir final-assets
          find release-artifacts -type f -exec cp {} final-assets/ \;
          ls -l final-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-${{ github.sha }}
          name: Alpha Release commit-${{ github.sha }}
          draft: true  # ! We need it as draft only !
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*
